services:
  postgres:
    image: postgres:16-alpine
    container_name: biddo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: biddo
      POSTGRES_USER: biddo
      POSTGRES_PASSWORD: biddo
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: biddo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: