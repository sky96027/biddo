spring:
  application:
    name: biddo

  datasource:
    url: jdbc:postgresql://localhost:5432/biddo
    username: ${DB_USERNAME:biddo}
    password: ${DB_PASSWORD:biddo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

server:
  port: 8080