# GitHub Secrets 필요 목록:
#   AWS_ACCESS_KEY_ID       — ECR push 권한 IAM 사용자 키
#   AWS_SECRET_ACCESS_KEY   — IAM 사용자 시크릿 키
#   ECR_REGISTRY            — <account-id>.dkr.ecr.ap-northeast-2.amazonaws.com
#   ECR_REPOSITORY          — biddo
#   EC2_APP_1_HOST          — EC2-App-1 Public IP (또는 Elastic IP)
#   EC2_APP_2_HOST          — EC2-App-2 Public IP (또는 Elastic IP)
#   EC2_USER                — ec2-user (Amazon Linux) 또는 ubuntu
#   EC2_SSH_KEY             — EC2 SSH 개인키 (PEM 파일 전체 내용)
#
# EC2 사전 준비:
#   - Docker, Docker Compose, AWS CLI 설치
#   - IAM 인스턴스 역할: ecr:GetAuthorizationToken, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer
#   - ~/biddo/docker-compose.app.yml 업로드
#   - ~/biddo/.env 생성 (DB_HOST, REDIS_HOST 등 연결 정보)

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '*.md'

env:
  AWS_REGION: ap-northeast-2

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 테스트
        run: ./gradlew test

  build-and-push:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: bootJar 빌드
        run: ./gradlew :biddo-api:bootJar -x test

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 및 푸시
        run: |
          IMAGE=${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

  deploy-app-1:
    name: Deploy to EC2-App-1
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2-App-1 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_APP_1_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            ECR_IMAGE="${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"

            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            if grep -q "^ECR_IMAGE=" ~/biddo/.env; then
              sed -i "s|^ECR_IMAGE=.*|ECR_IMAGE=$ECR_IMAGE|" ~/biddo/.env
            else
              echo "ECR_IMAGE=$ECR_IMAGE" >> ~/biddo/.env
            fi

            docker compose -f ~/biddo/docker-compose.app.yml pull
            docker compose -f ~/biddo/docker-compose.app.yml up -d

            for i in $(seq 1 18); do
              if curl -sf http://localhost:9090/actuator/health > /dev/null 2>&1; then
                echo "헬스체크 통과 (시도 $i)"
                exit 0
              fi
              echo "대기 중... ($i/18)"
              sleep 10
            done
            echo "헬스체크 타임아웃"
            exit 1

  deploy-app-2:
    name: Deploy to EC2-App-2
    needs: [build-and-push, deploy-app-1]
    runs-on: ubuntu-latest
    steps:
      - name: EC2-App-2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_APP_2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            ECR_IMAGE="${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"

            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            if grep -q "^ECR_IMAGE=" ~/biddo/.env; then
              sed -i "s|^ECR_IMAGE=.*|ECR_IMAGE=$ECR_IMAGE|" ~/biddo/.env
            else
              echo "ECR_IMAGE=$ECR_IMAGE" >> ~/biddo/.env
            fi

            docker compose -f ~/biddo/docker-compose.app.yml pull
            docker compose -f ~/biddo/docker-compose.app.yml up -d

            for i in $(seq 1 18); do
              if curl -sf http://localhost:9090/actuator/health > /dev/null 2>&1; then
                echo "헬스체크 통과 (시도 $i)"
                exit 0
              fi
              echo "대기 중... ($i/18)"
              sleep 10
            done
            echo "헬스체크 타임아웃"
            exit 1

  deploy-frontend:
    name: Deploy Frontend to S3
    needs: deploy-app-2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: 의존성 설치
        run: npm ci
        working-directory: front

      - name: 빌드
        run: npm run build
        working-directory: front

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3 업로드
        run: aws s3 sync front/dist/ s3://${{ secrets.FRONTEND_BUCKET }} --delete

      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"