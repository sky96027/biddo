global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'biddo-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'REPLACE_EC2_APP_1_PRIVATE_IP:9090'
          - 'REPLACE_EC2_APP_2_PRIVATE_IP:9090'
        labels:
          application: 'biddo'

  - job_name: 'kafka-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['kafka-exporter:9308']